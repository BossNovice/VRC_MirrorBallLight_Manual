<script>
// 移動はここだけで行います。**head の meta refresh は noscript の中です。**
// 両方が動くと、アンカー付きで開かれたときに meta 側が先に走り、
// 節を失ったページ先頭へ飛んでしまいます（順序は保証されません）。
(function () {
  var map = {"blink": "06_spots.html#blink", "color": "05_motion.html#color", "distance": "05_motion.html#distance", "recipes": "05_motion.html#recipes", "reflection": "05_motion.html#reflection", "rotation": "05_motion.html#rotation", "spots": "06_spots.html#spots"};

  var hash = location.hash.replace(/^#/, "");
  if (hash && map[hash]) { location.replace(map[hash]); return; }
  if (fallback) { location.replace(fallback); }
})();
</script>
