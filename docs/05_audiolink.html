<script>
// 移動はここだけで行います。**head の meta refresh は noscript の中です。**
// 両方が動くと、アンカー付きで開かれたときに meta 側が先に走り、
// 節を失ったページ先頭へ飛んでしまいます（順序は保証されません）。
(function () {
  var map = {"avatar": "12_audiolink.html#avatar", "bands": "12_audiolink.html#bands", "history": "12_audiolink.html#history", "material-mask": "12_audiolink.html#material-mask", "response": "12_audiolink.html#response", "setup": "12_audiolink.html#setup", "test": "12_audiolink.html#test"};
  var fallback = "12_audiolink.html";   // 移動先が1つに決まる場合だけ入ります
  var hash = location.hash.replace(/^#/, "");
  if (hash && map[hash]) { location.replace(map[hash]); return; }
  if (fallback) { location.replace(fallback); }
})();
</script>
