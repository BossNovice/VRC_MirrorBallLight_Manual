<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="本体表示モードの切替で入れ替わるもの">
<style>
 .bg{fill:#0d1117}
 .box{fill:#161b22;stroke:#30363d;rx:8}
 .on{stroke:#3fb950}
 .off{stroke:#30363d}
 .warn{stroke:#d29922}
 .t{fill:#e6edf3;font:14px "Segoe UI","Noto Sans JP",sans-serif}
 .h{fill:#79c0ff;font:bold 14px "Segoe UI","Noto Sans JP",sans-serif}
 .m{fill:#9da7b3;font:12.5px "Segoe UI","Noto Sans JP",sans-serif}
 .dim{fill:#6a7480;font:14px "Segoe UI","Noto Sans JP",sans-serif}
 .ttl{fill:#e6edf3;font:bold 17px "Segoe UI","Noto Sans JP",sans-serif}
</style>
<rect class="bg" width="900" height="380"/>
<text class="ttl" x="24" y="32">本体表示モードを切り替えると何が入れ替わるか</text>

<text class="h" x="24" y="70">通常版（0）</text>
<rect class="box on" x="24" y="82" width="400" height="60"/>
<text class="t" x="40" y="108">MirrorBallFacetBody</text>
<text class="m" x="40" y="130">SetActive(true)　表示されています</text>
<rect class="box off" x="24" y="152" width="400" height="60"/>
<text class="dim" x="40" y="178">MirrorBallFacetBody (VRCLightVolumes + LTCGI)</text>
<text class="m" x="40" y="200">SetActive(false)　隠れています</text>

<text class="h" x="476" y="70">連携版（1）</text>
<rect class="box off" x="476" y="82" width="400" height="60"/>
<text class="dim" x="492" y="108">MirrorBallFacetBody</text>
<text class="m" x="492" y="130">SetActive(false)　隠れています</text>
<rect class="box on" x="476" y="152" width="400" height="60"/>
<text class="t" x="492" y="178">MirrorBallFacetBody (VRCLightVolumes + LTCGI)</text>
<text class="m" x="492" y="200">SetActive(true)　表示されています</text>

<rect class="box warn" x="24" y="240" width="852" height="110"/>
<text class="t" x="40" y="268">入れ替わるのは<tspan fill="#d29922" font-weight="bold">本体球のオブジェクトだけ</tspan>です。Materialを差し替えているのではありません。</text>
<text class="t" x="40" y="296">壁・床・ガラスのMaterialは<tspan fill="#d29922" font-weight="bold">自動では変わりません。</tspan>使うモードに合うMaterialを自分で割り当ててください。</text>
<text class="m" x="40" y="322">通常版＝名前が _Standard で終わるMaterial／連携版＝名前が _LTCGI_LightVolumes で終わるMaterial</text>
</svg>
