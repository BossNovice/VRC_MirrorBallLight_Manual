<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="1つのUIから複数のミラーボールへ接続する構成">
<style>
 .bg{fill:#0d1117}
 .box{fill:#161b22;stroke:#30363d;rx:8}
 .ui{stroke:#1f6feb}
 .ball{stroke:#3fb950}
 .t{fill:#e6edf3;font:14px "Segoe UI","Noto Sans JP",sans-serif}
 .h{fill:#79c0ff;font:bold 14px "Segoe UI","Noto Sans JP",sans-serif}
 .m{fill:#9da7b3;font:12.5px "Segoe UI","Noto Sans JP",sans-serif}
 .ttl{fill:#e6edf3;font:bold 17px "Segoe UI","Noto Sans JP",sans-serif}
</style>
<rect class="bg" width="900" height="420"/>
<text class="ttl" x="24" y="32">1つのUdonから複数のミラーボールへ</text>
<defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
 <path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker></defs>

<rect class="box ui" x="24" y="120" width="290" height="150"/>
<text class="h" x="40" y="150">自分で書くUdonBehaviour</text>
<text class="m" x="40" y="176">例：DJブースのボタン</text>
<text class="t" x="40" y="208">public UdonBehaviour[] mirrorBalls;</text>
<text class="m" x="40" y="234">Inspectorのこの配列へ、各ミラーボールの</text>
<text class="m" x="40" y="254">ルート（Controllerが付いた側）を入れます</text>

<line x1="314" y1="150" x2="470" y2="98" stroke="#58a6ff" marker-end="url(#c)"/>
<line x1="314" y1="195" x2="470" y2="195" stroke="#58a6ff" marker-end="url(#c)"/>
<line x1="314" y1="240" x2="470" y2="292" stroke="#58a6ff" marker-end="url(#c)"/>

<rect class="box ball" x="476" y="66" width="400" height="66"/>
<text class="h" x="492" y="92">MirrorBallLight_A（Controller）</text>
<text class="m" x="492" y="116">apiPresetIndex ＝ 2 → RequestSelectPreset</text>

<rect class="box ball" x="476" y="162" width="400" height="66"/>
<text class="h" x="492" y="188">MirrorBallLight_B（Controller）</text>
<text class="m" x="492" y="212">apiPresetIndex ＝ 2 → RequestSelectPreset</text>

<rect class="box ball" x="476" y="258" width="400" height="66"/>
<text class="h" x="492" y="284">MirrorBallLight_C（Controller）</text>
<text class="m" x="492" y="308">apiPresetIndex ＝ 5 → 別の演出にもできます</text>

<text class="m" x="24" y="372">送る先はControllerが付いたオブジェクトです。子の mirrorball（回転Root）ではありません。</text>
<text class="m" x="24" y="394">台数を増やすほど描画も重くなります。見えていない場所まで動かし続けていないか確かめてください。</text>
</svg>
