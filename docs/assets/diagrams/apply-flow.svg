<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="自分の壁へ適用する5つの手順">
<style>
 .bg{fill:#08070b}
 .cell{fill:#0d0b12;stroke:#1b1823;stroke-width:1}
 .sub{fill:#12101a;stroke:#241f30;stroke-width:1}
 .warn{fill:#1d1410;stroke:#7a4a2a;stroke-width:1}
 .t{fill:#ece9f2;font:15px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .h{fill:#ffcf5c;font:bold 16px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .m{fill:#8a8399;font:13px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .code{fill:#7ee0a6;font:13px "Consolas","Noto Sans Mono",monospace}
 .ttl{fill:#ece9f2;font:bold 17px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .num{fill:#08070b;font:bold 15px "Segoe UI",sans-serif}
 .dot{fill:#ffcf5c}
 .ar{stroke:#4a5566;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5566"/></marker></defs>
<rect class="bg" width="900" height="560"/>
<text class="ttl" x="24" y="34">自分の壁・床へ適用するまで</text>

<rect class="cell" x="40" y="58" width="820" height="62" rx="8"/>
<circle class="dot" cx="70" cy="80" r="13"/><text class="num" x="70" y="85" text-anchor="middle">1</text>
<text class="h" x="96" y="85">壁のMaterialを複製する</text>
<text class="m" x="96" y="108">Projectウィンドウで選び Ctrl+D。付属Materialをそのまま編集すると、サンプルと統合Prefabの見た目も一緒に変わります。</text>
<path class="ar" d="M450 120 L450 142"/>

<rect class="cell" x="40" y="144" width="820" height="126" rx="8"/>
<circle class="dot" cx="70" cy="166" r="13"/><text class="num" x="70" y="171" text-anchor="middle">2</text>
<text class="h" x="96" y="171">Inspector上部のShaderを選び直す</text>
<rect class="sub" x="96" y="188" width="360" height="64" rx="6"/>
<text class="t" x="114" y="212">通常の壁・床</text>
<text class="code" x="114" y="236">MirrorBallLight/MirrorBallSurfaceAuto</text>
<rect class="sub" x="472" y="188" width="372" height="64" rx="6"/>
<text class="t" x="490" y="212">ガラスなど透過するもの</text>
<text class="code" x="490" y="236">…/MirrorBallSurfaceAutoTransparent</text>
<path class="ar" d="M450 270 L450 292"/>

<rect class="cell" x="40" y="294" width="820" height="62" rx="8"/>
<circle class="dot" cx="70" cy="316" r="13"/><text class="num" x="70" y="321" text-anchor="middle">3</text>
<text class="h" x="96" y="321">元の見た目を新しい項目へ入れ直す</text>
<text class="m" x="96" y="344">Base Texture・色・Normal Map・金属感・滑らかさ。まとめて移したいときはMaterial変換を使います。</text>
<path class="ar" d="M450 356 L450 378"/>

<rect class="cell" x="40" y="380" width="820" height="62" rx="8"/>
<circle class="dot" cx="70" cy="402" r="13"/><text class="num" x="70" y="407" text-anchor="middle">4</text>
<text class="h" x="96" y="407">Controllerで「対象マテリアルをシーンから自動検出」を押す</text>
<text class="m" x="96" y="430">一覧に無いMaterialへは何も書かれません。壁を増やしたら、そのたびに押します。</text>
<path class="ar" d="M450 442 L450 464"/>

<rect class="cell" x="40" y="466" width="820" height="62" rx="8"/>
<circle class="dot" cx="70" cy="488" r="13"/><text class="num" x="70" y="493" text-anchor="middle">5</text>
<text class="h" x="96" y="493">「現在の設定をマテリアルへ反映・保存」を押す</text>
<text class="m" x="96" y="516">Edit Modeでの変更は、これを押してはじめてMaterialへ保存されます。</text>
</svg>
