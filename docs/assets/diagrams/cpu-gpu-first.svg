<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="CPUとGPUのどちらが原因かを先に確かめる手順">
<style>
 .bg{fill:#08070b}
 .box{fill:#0d0b12;stroke:#1b1823;rx:8}
 .q{stroke:#ffcf5c}
 .cpu{stroke:#ff9d6b}
 .gpu{stroke:#7ee0a6}
 .bad{stroke:#ff6b6b}
 .t{fill:#ece9f2;font:14px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .h{fill:#ffcf5c;font:bold 14px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .m{fill:#8a8399;font:12.5px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
 .ttl{fill:#ece9f2;font:bold 17px "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
</style>
<rect class="bg" width="900" height="400"/>
<text class="ttl" x="24" y="32">手を打つ前に、原因がどちらかを確かめる</text>
<defs><marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
 <path d="M0,0 L9,4.5 L0,9 z" fill="#ffcf5c"/></marker></defs>

<rect class="box q" x="24" y="56" width="852" height="72"/>
<text class="h" x="40" y="82">Profilerで CPU Usage と GPU Usage の中央値を数百フレーム分くらべる</text>
<text class="m" x="40" y="106">グラフを目で見て比べないでください。1フレームごとの揺れに、設定変更の差が埋もれます。平均も使いません</text>

<line x1="250" y1="128" x2="250" y2="156" stroke="#ffcf5c" marker-end="url(#d)"/>
<line x1="650" y1="128" x2="650" y2="156" stroke="#ffcf5c" marker-end="url(#d)"/>

<rect class="box cpu" x="24" y="160" width="410" height="120"/>
<text class="h" x="40" y="188">CPUのほうが大きい</text>
<text class="t" x="40" y="216">更新頻度・スクリプト側を見ます。</text>
<text class="t" x="40" y="242">GPU向けの手を打っても、</text>
<text class="t" x="40" y="266">フレームレートは1つも改善しません。</text>

<rect class="box gpu" x="466" y="160" width="410" height="120"/>
<text class="h" x="482" y="188">GPUのほうが大きい</text>
<text class="t" x="482" y="216">オーバードロー・解像度・距離フェード</text>
<text class="t" x="482" y="242">を見ます。CPU向けの手を打っても、</text>
<text class="t" x="482" y="266">やはり改善しません。</text>

<rect class="box bad" x="24" y="300" width="852" height="76"/>
<text class="t" x="40" y="328">設定を変えても数字が動かないときは、<tspan fill="#ff6b6b" font-weight="bold">そもそもそこが原因ではありません。</tspan></text>
<text class="m" x="40" y="354">この手順に戻って、CPUとGPUのどちらが原因かを確かめ直してください</text>
</svg>
