<script>
// 移動はここだけで行います。**head の meta refresh は noscript の中です。**
// 両方が動くと、アンカー付きで開かれたときに meta 側が先に走り、
// 節を失ったページ先頭へ飛んでしまいます（順序は保証されません）。
(function () {
  var map = {"objects": "02_sample.html#objects", "place": "02_sample.html#place", "prefab": "02_sample.html#prefab", "reuse": "03_apply.html#reuse", "verify": "02_sample.html#verify"};
  var fallback = null;   // 移動先が1つに決まる場合だけ入ります
  var hash = location.hash.replace(/^#/, "");
  if (hash && map[hash]) { location.replace(map[hash]); return; }
  if (fallback) { location.replace(fallback); }
})();
</script>
